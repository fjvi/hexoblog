- name: Create Post from Issue
  uses: actions/github-script@v7
  with:
    script: |
      const fs = require('fs');
      const issue = context.payload.issue;
      if (!issue || issue.state === 'closed') return;

      // 1. 读模板
      const templatePath = 'scaffolds/post.md';
      if (!fs.existsSync(templatePath)) {
        throw new Error('找不到模板文件: ' + templatePath);
      }
      const template = fs.readFileSync(templatePath, 'utf8');

      // 2. 准备变量
      const now = new Date(issue.created_at);
      const pad = n => String(n).padStart(2, '0');
      const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      
      // 3. 替换模板里的变量
      let frontMatter = template
        .replace(/\{\{\s*title\s*\}\}/g, issue.title)
        .replace(/\{\{\s*date\s*\}\}/g, dateStr);

      // 4. 组装文件（模板已有 --- 头尾，直接拼正文）
      const content = frontMatter.trim() + '\n\n' + (issue.body || '');

      // 5. 写文件
      const fileName = `source/_posts/issue-${issue.number}.md`;
      fs.writeFileSync(fileName, content, 'utf8');
      console.log('✅ 写入文件:', fileName);
      console.log('===== 文件内容预览 =====');
      console.log(content.substring(0, 500));
