- name: Create Post from Issue
  uses: actions/github-script@v7
  with:
    script: |
      const fs = require('fs');
      const issue = context.payload.issue;
      if (!issue || issue.state === 'closed') return;

      // 1. 读取你的模板文件
      let template = '';
      try {
        template = fs.readFileSync('scaffolds/post.md', 'utf8');
      } catch (e) {
        console.log('未找到 scaffolds/post.md，使用默认模板');
        template = '---\ntitle: {{ title }}\ndate: {{ date }}\ntags:\n---\n';
      }

      // 2. 替换模板变量（Hexo 脚手架用 {{ title }} 这种占位符）
      const now = new Date(issue.created_at);
      const dateStr = now.toISOString().replace('T', ' ').substring(0, 19);
      
      let frontMatter = template
        .replace(/\{\{\s*title\s*\}\}/g, issue.title)
        .replace(/\{\{\s*date\s*\}\}/g, dateStr)
        .replace(/\{\{\s*layout\s*\}\}/g, 'post');

      // 3. 处理标签：把 Issue 的 labels 转成 Hexo tags
      const tags = issue.labels.map(l => `  - ${l.name}`).join('\n');
      if (tags) {
        // 如果模板里没有 tags 字段，追加进去
        if (!frontMatter.includes('tags:')) {
          frontMatter = frontMatter.replace(/---\s*$/, `tags:\n${tags}\n---`);
        }
      }

      // 4. 拼接正文，确保 Markdown 格式
      const content = frontMatter + '\n\n' + (issue.body || '');

      // 5. 文件名：用 issue 编号，避免标题里的特殊字符
      const fileName = `source/_posts/issue-${issue.number}.md`;
      fs.writeFileSync(fileName, content, 'utf8');
      console.log(`✅ Created ${fileName}`);
